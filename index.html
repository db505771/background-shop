<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backgrounds</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "SF Pro Text", system-ui, sans-serif;
        color: white;
    }

    body {
        overflow-x: hidden;
    }

    .container {
        width: 100%;
        padding: 12px;
    }

    /* CATEGORY BUTTONS */

    .categories {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
        margin-bottom: 14px;
    }

    .category {
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.65);
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.18s ease;
    }

    .category:active {
        transform: scale(0.97);
    }

    .category.selected {
        background: rgba(255, 255, 255, 0.16);
        color: white;
    }

    /* SHOP GRID */

    .shop-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
    }

    /* BACKGROUND CARD */

    .background-card {
        position: relative;
        width: 100%;
        height: 82px;
        border-radius: 18px;
        border: 2px solid transparent;
        padding: 5px;
        background: transparent;
        cursor: pointer;
        transition:
            transform 0.16s ease,
            border-color 0.16s ease;
    }

    .background-card:active {
        transform: scale(0.96);
    }

    .background-card.selected {
        border-color: white;
    }

    /* BACKGROUND PREVIEW */

    .background-preview {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        position: relative;
        overflow: hidden;
    }

    /* NAME */

    .background-name {
        position: absolute;
        left: 10px;
        bottom: 8px;
        right: 10px;

        font-size: 12px;
        line-height: 15px;
        font-weight: 600;

        color: white;

        text-shadow:
            0 1px 4px rgba(0, 0, 0, 0.8),
            0 0 8px rgba(0, 0, 0, 0.5);

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    @media (min-width: 600px) {
        .shop-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    @media (min-width: 900px) {
        .shop-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
    }
</style>
</head>

<body>

/* =========================================================
   STATE
   ========================================================= */

let currentCategory = "Default";

let equippedConfig = {
    type: "Solid",
    color: "#0d0d11",
    middle: "",
    end: ""
};


/* =========================================================
   CATEGORY SWITCHING
   ========================================================= */

function switchCategory(category) {

    currentCategory = category;

    const defaultButton =
        document.getElementById("defaultButton");

    const gradientButton =
        document.getElementById("gradientButton");

    defaultButton.classList.remove("selected");
    gradientButton.classList.remove("selected");

    if (category === "Default") {
        defaultButton.classList.add("selected");
    } else {
        gradientButton.classList.add("selected");
    }

    renderShop();
}


/* =========================================================
   RENDER SHOP
   ========================================================= */

function renderShop() {

    const grid =
        document.getElementById("shopGrid");

    grid.innerHTML = "";

    const filteredItems =
        shopItems.filter(item => {

            if (currentCategory === "Default") {
                return item.type === "Solid";
            }

            return item.type === "Gradient";
        });

    filteredItems.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "background-card";

        if (checkIsEquipped(item)) {
            card.classList.add("selected");
        }

        const preview =
            document.createElement("div");

        preview.className =
            "background-preview";

        /* SOLID */

        if (item.type === "Solid") {

            preview.style.background =
                item.color;

        }

        /* GRADIENT */

        else {

            preview.style.background =
                `linear-gradient(
                    135deg,
                    ${item.color},
                    ${item.middle},
                    ${item.end}
                )`;

        }

        const name =
            document.createElement("div");

        name.className =
            "background-name";

        name.textContent =
            item.name;

        preview.appendChild(name);

        card.appendChild(preview);

        card.onclick = () => {

            equipBackground(item);

        };

        grid.appendChild(card);

    });
}


/* =========================================================
   CHECK EQUIPPED
   ========================================================= */

function checkIsEquipped(item) {

    if (!equippedConfig) {
        return false;
    }

    if (item.type !== equippedConfig.type) {
        return false;
    }

    if (item.color !== equippedConfig.color) {
        return false;
    }

    if (item.type === "Gradient") {

        return (
            item.middle === equippedConfig.middle &&
            item.end === equippedConfig.end
        );

    }

    return true;
}


/* =========================================================
   EQUIP BACKGROUND
   ========================================================= */

function equipBackground(item) {

    equippedConfig = {
        type: item.type,
        color: item.color,
        middle: item.middle || "",
        end: item.end || ""
    };

    applyBackground();

    renderShop();

    sendEquipRequest(item);
}


/* =========================================================
   APPLY BACKGROUND
   ========================================================= */

function applyBackground() {

    if (equippedConfig.type === "Gradient") {

        document.body.style.background =
            `linear-gradient(
                135deg,
                ${equippedConfig.color},
                ${equippedConfig.middle},
                ${equippedConfig.end}
            )`;

    } else {

        document.body.style.background =
            equippedConfig.color;

    }
}


/* =========================================================
   SEND TO GOOGLE SHEETS
   ========================================================= */

function sendEquipRequest(item) {

    const data = {

        action: "equip",

        type: item.type,

        color: item.color,

        middle: item.middle || "",

        end: item.end || ""

    };

    fetch(API_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)

    }).catch(error => {

        console.log(
            "Background save error:",
            error
        );

    });

}


/* =========================================================
   LOAD GOOGLE SHEET DATA
   ========================================================= */

async function loadSheetData() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();

        if (
            data &&
            data.equipped
        ) {

            equippedConfig = {

                type:
                    data.equipped.type ||
                    "Solid",

                color:
                    data.equipped.color ||
                    "#0d0d11",

                middle:
                    data.equipped.middle ||
                    "",

                end:
                    data.equipped.end ||
                    ""

            };

            applyBackground();

            renderShop();

        }

    } catch (error) {

        console.log(
            "Could not load background:",
            error
        );

        /* Default background */

        applyBackground();

    }

}

   START
